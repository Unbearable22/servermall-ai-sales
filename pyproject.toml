[project]
name = "servermall-ai-sales"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "pydantic>=2,<3", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "pydantic-settings>=2,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.6,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
